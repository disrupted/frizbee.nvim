[package]
name = "frizbee-nvim"
version = "0.1.0"
edition = "2024"
description = "High-performance fuzzy matching Lua module for Neovim, powered by frizbee"
license = "MIT"

[lib]
# cdylib for the loadable Lua module, rlib for tests and bench binary
crate-type = ["cdylib", "rlib"]

[features]
# Opt-in feature for the `bench` binary so a plain `cargo build`/`test` skips it.
bench = []

[[bin]]
name = "bench"
path = "src/bench.rs"
required-features = ["bench"]

[dependencies]
frizbee = "0.13.0"
mlua = { version = "0.12.1", features = ["luajit", "module"] }
